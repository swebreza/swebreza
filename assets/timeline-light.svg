<svg xmlns="http://www.w3.org/2000/svg" width="840" height="332" viewBox="0 0 840 332" role="img" aria-label="Build timeline, March to August 2026: Emireq from 18 Mar to 26 Aug, Hashtora from 22 May to 26 Aug, Zymedics from 21 Apr to 25 Aug, Credorz from 14 Jul to 30 Jul, DataZonn from 06 Aug to 14 Aug, Takafulik from 16 Apr to 16 Apr">
<style>.t{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.h{font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;font-weight:600;}@media (prefers-reduced-motion: reduce){.sp{animation:none !important;transform:scaleX(1) !important;}}.sp{transform-origin:left center;animation:span 1s cubic-bezier(.2,.7,.3,1) both;}@keyframes span{from{transform:scaleX(0);}to{transform:scaleX(1);}}</style>
<text x="0" y="26" class="h" font-size="17" fill="#1B1B1F">Six verticals, built in parallel</text>
